<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screening Grupo Sazón</title>
<style>
:root{color-scheme:light;--ink:#17242c;--muted:#566670;--line:#d8dfdc;--soft:#f4f6f5;--bg:#ffffff;--focus:#0f6e8c;--green:#1e7a46;--red:#b3261e;--amber:#a86a00;--slate:#4a5a6a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;padding:16px 24px 18px;gap:10px}
header h1{font-size:22px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.2px}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.group>span{font-size:13px;color:var(--muted);margin-right:2px}
button{font:inherit;font-size:13.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;min-height:34px;padding:5px 11px;cursor:pointer}
button:hover{background:var(--soft);border-color:#b9c4bf}
button:focus-visible,.node:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,#8a979f)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.icon{min-width:34px;padding:5px 8px;font-size:16px;line-height:1}
#level{min-width:52px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#canvas{position:relative;flex:1 1 400px;min-height:320px;overflow:hidden;background:#fff radial-gradient(#dfe5e2 1px,transparent 1px) 0 0/22px 22px;border:1px solid var(--line);border-radius:14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#canvas.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage svg{display:block;max-width:none!important}
.node{cursor:pointer;transition:opacity .15s}
.edgePaths path,.edgeLabels>.edgeLabel{transition:opacity .15s}
.node:hover{filter:drop-shadow(0 2px 5px rgba(23,36,44,.3))}
.node.sel{filter:drop-shadow(0 0 7px rgba(15,110,140,.85))}
.dim{opacity:.13}
#hint{position:absolute;left:12px;bottom:9px;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.88);border-radius:6px;padding:2px 7px;pointer-events:none}
#panel{flex:0 0 auto;border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:12px 16px 14px}
#panel h2{font-size:15.5px;font-weight:650;margin:0}
#panel .sub{margin:1px 0 8px;font-size:13.5px;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 22px}
.rules h3{font-size:13.5px;margin:0;font-weight:650}
.rules p{font-size:13.5px;line-height:1.38;margin:0;color:#31404a}
ul.points{columns:2;column-gap:28px;margin:0;padding-left:18px;font-size:14px;line-height:1.4;color:#31404a}
ul.points li{break-inside:avoid;margin:0 0 4px}
@media(max-width:900px){body{padding:12px 16px}#canvas{flex-basis:56vh}.rules{grid-template-columns:1fr}ul.points{columns:1}#hint{display:none}}
@media print{
 @page{size:A4 landscape;margin:8mm}
 html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{display:block;padding:0;min-height:0}
 .bar,#hint,.noprint{display:none}
 #canvas{border:0;background:none;overflow:visible;height:auto;min-height:0}
 #stage{position:static;transform:none!important}
 #stage svg{width:100%!important;height:auto!important}
 #panel{margin-top:6px;padding:8px 10px;break-inside:avoid}
 .rules p,.rules h3{font-size:10.5px}
 .dim{opacity:1}
}
</style>
</head>

<header>
<h1>Grupo Sazón · Screening de repartidores</h1>
<p>Flujo de la conversación y qué ocurre en cada resultado.</p>
</header>

<div class="bar">
<div class="group" role="group" aria-label="Ver recorrido">
<span>Ver recorrido:</span>
<button class="chip" data-path="all" aria-pressed="true">Todo</button>
<button class="chip" data-path="OK" aria-pressed="false" style="--c:var(--green)"><i></i>Screening superado</button>
<button class="chip" data-path="REJ" aria-pressed="false" style="--c:var(--red)"><i></i>Descalificado</button>
<button class="chip" data-path="REV" aria-pressed="false" style="--c:var(--amber)"><i></i>Pendiente de revisión</button>
<button class="chip" data-path="INC" aria-pressed="false" style="--c:var(--slate)"><i></i>Incompleto</button>
</div>
<div class="group" role="group" aria-label="Zoom">
<button class="icon" id="out" aria-label="Reducir">−</button>
<output id="level" aria-live="polite">100%</output>
<button class="icon" id="in" aria-label="Ampliar">+</button>
<button id="fit">Ajustar</button>
<button id="full">Pantalla completa</button>
</div>

<script>
(function(){
var canvas=document.getElementById('canvas'),stage=document.getElementById('stage'),svg=stage.querySelector('svg'),panel=document.getElementById('panel'),level=document.getElementById('level');
var W=+svg.dataset.w,H=+svg.dataset.h;
svg.style.width=W+'px';svg.style.height=H+'px';

/* ---------- Zoom y desplazamiento ---------- */
var view={x:0,y:0,k:1},fitted=true,MAX=4;
function fitScale(){return Math.min(canvas.clientWidth/W,canvas.clientHeight/H)*.98}
function apply(){stage.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.k+')';level.textContent=Math.round(view.k*100)+'%'}
function fit(){var k=fitScale();view.k=k;view.x=(canvas.clientWidth-W*k)/2;view.y=(canvas.clientHeight-H*k)/2;fitted=true;apply()}
function zoomAt(f,cx,cy){var min=fitScale()*.6,k=Math.max(min,Math.min(MAX,view.k*f));f=k/view.k;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=k;fitted=false;apply()}
function center(f){zoomAt(f,canvas.clientWidth/2,canvas.clientHeight/2)}
canvas.addEventListener('wheel',function(e){e.preventDefault();var r=canvas.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});

var pts=new Map(),down=null,pinch=null;
canvas.addEventListener('pointerdown',function(e){
  if(e.button!==0)return;
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){down={x:e.clientX,y:e.clientY,moved:false,node:e.target.closest&&e.target.closest('.node')}}
  else{pinch=null;if(down)down.moved=true}
});
canvas.addEventListener('pointermove',function(e){
  var p=pts.get(e.pointerId);if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pts.size===2){
    var a=Array.from(pts.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),r=canvas.getBoundingClientRect();
    if(pinch)zoomAt(d/pinch,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top);
    pinch=d;return;
  }
  if(!down)return;
  if(!down.moved&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<4)return;
  down.moved=true;canvas.classList.add('drag');view.x+=dx;view.y+=dy;fitted=false;apply();
});
function release(e){
  pts.delete(e.pointerId);pinch=null;canvas.classList.remove('drag');
  if(e.type==='pointerup'&&down&&!down.moved&&pts.size===0){if(down.node)pick(down.node.dataset.key);else clearPick()}
  if(pts.size===0)down=null;
}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);

document.getElementById('in').onclick=function(){center(1.25)};
document.getElementById('out').onclick=function(){center(.8)};
document.getElementById('fit').onclick=fit;
var fullBtn=document.getElementById('full');
if(!document.documentElement.requestFullscreen)fullBtn.hidden=true;
fullBtn.onclick=function(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
document.addEventListener('fullscreenchange',function(){fullBtn.textContent=document.fullscreenElement?'Salir':'Pantalla completa';fit()});
canvas.addEventListener('scroll',function(){view.x-=canvas.scrollLeft;view.y-=canvas.scrollTop;canvas.scrollLeft=canvas.scrollTop=0;fitted=false;apply()});
new ResizeObserver(function(){if(fitted)fit()}).observe(canvas);
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest&&e.target.closest('button,.node')&&(e.key==='Enter'||e.key===' '))return;
  var step=60,used=true;
  if(e.key==='+'||e.key==='=')center(1.25);
  else if(e.key==='-')center(.8);
  else if(e.key==='0')fit();
  else if(e.key==='ArrowLeft'){view.x+=step;fitted=false;apply()}
  else if(e.key==='ArrowRight'){view.x-=step;fitted=false;apply()}
  else if(e.key==='ArrowUp'){view.y+=step;fitted=false;apply()}
  else if(e.key==='ArrowDown'){view.y-=step;fitted=false;apply()}
  else if(e.key==='Escape'){clearPick();setPath('all')}
  else used=false;
  if(used&&e.key!=='Escape')e.preventDefault();
});

var INFO={
 A:{t:'Bienvenida y nombre',s:'Se presenta como asistente virtual de Grupo Sazón.',p:['Explicar brevemente el propósito y pedir el nombre completo.','El nombre es requerido para completar. Aclarar si parece incompleto, sin imponer dos apellidos, un alfabeto o un número fijo de palabras.','Mensajes de 1–3 frases cortas y una pregunta principal por turno. Tono cercano y profesional, tuteo, sin emojis por defecto.','Chat web mediante enlace, sin registro.']},
 B:{t:'Permiso de conducir',s:'Primer criterio eliminatorio.',p:['Preguntar si lo tiene actualmente. Una negativa inequívoca provoca descarte temprano.','Una respuesta ambigua requiere aclaración. «Me lo estoy sacando» requiere aclarar si ya lo tiene.','Si la duda persiste, se registra y la conversación continúa.','Información declarada: sin verificación documental ni categorías de permiso añadidas.']},
 C:{t:'Zona de trabajo',s:'Segundo criterio eliminatorio.',p:['Preguntar dónde quiere trabajar y contrastar con el catálogo. Aclarar país o localidad cuando sea necesario.','No equiparar residencia con zona deseada ni inventar cobertura por proximidad.','Si propone varias opciones, basta una cubierta. Si todas están fuera de cobertura, se ofrecen una sola vez las ciudades del catálogo; solo se descarta si las rechaza o insiste en una zona no cubierta.','Catálogo de demo (ficticio): Madrid, Barcelona, Valencia, Sevilla, Ciudad de México, Guadalajara, Monterrey y Puebla.']},
 D:{t:'Perfil restante',s:'Datos no eliminatorios: el enunciado no establece mínimos.',p:['Disponibilidad: una o varias entre jornada completa, parcial y fines de semana.','Horario preferido: una o varias entre mañana, tarde, noche y flexible.','Experiencia: duración y plataformas o empresas. Sin experiencia: 0 años y ninguna plataforma; no descarta.','Incorporación: fecha, periodo aproximado, condición o desconocimiento explícito. No inventar una fecha ni bloquear por esa incertidumbre.']},
 E:{t:'Determinar el resultado',s:'Se evalúan los 7 campos antes del cierre.',p:['Si alguno de los 7 campos sigue sin resolver tras recoger los demás posibles: Pendiente de revisión.','Si están recogidos conforme a sus reglas, con permiso afirmativo y cobertura confirmada: Screening superado.','Una incorporación explícitamente desconocida es una respuesta admitida, no una ambigüedad bloqueante.','Tras comunicar el cierre, no se admiten cambios ni se reinicia el screening.']},
 OK:{t:'Screening superado',s:'No implica contratación ni garantiza entrevista.',p:['Campos recogidos conforme a sus reglas, permiso afirmativo y cobertura confirmada.','Agradecer y dejar para revisión del equipo, sin mostrar el resumen ni solicitar confirmación final.','Guardar datos e historial y generar el resumen interno.','Ejemplo: «Gracias por tu tiempo, Ana. Hemos registrado tu candidatura para que el equipo de selección la revise».']},
 REJ:{t:'Descalificado',s:'Falta de permiso, o ausencia de cobertura tras rechazar las alternativas.',p:['Cerrar pronto, explicar el motivo y conservar lo recogido.','Un incumplimiento confirmado determina descarte aunque haya otras dudas.','La ambigüedad nunca descarta por sí sola.','El JSON mantiene todas las claves: los campos no recogidos quedan en null.']},
 REV:{t:'Pendiente de revisión',s:'Alguno de los 7 campos sigue sin resolver.',p:['Se llega tras recoger los demás campos posibles.','Registrar la duda y comunicar que el equipo deberá revisarla.','La revisión humana es un registro de casos para el recruiter, no atención en directo.']},
 INC:{t:'Incompleto',s:'Conversación interrumpida antes del cierre, en cualquier etapa.',p:['Conservar el progreso sin equiparar silencio a descarte.','Un único recordatorio a los 10 minutos de inactividad si el chat sigue abierto. No enviar mensajes externos.','Reanudar sin repetir datos al recuperar la sesión, desde el mismo navegador.','Si solicita terminar: respetarlo, mantenerlo como incompleto y cesar recordatorios.']},
 REC:{t:'Decisión del recruiter',s:'Independiente del resultado del screening.',p:['Listar y filtrar por estado; consultar candidatura y conversación.','Registrar su decisión: sin revisar, avanza o descartado.','El resumen interno contiene datos clave, resultado, motivo y dudas o consultas pendientes.','Se conserva el historial completo. Las candidaturas incompletas aparecen con su progreso e historial, sin resumen.']}
};
var RULES=[
 ['Inválido o ambiguo','Máximo dos aclaraciones por dato, además de la pregunta inicial: reformular y después dar ejemplos u opciones. Si persiste, registrar la duda y continuar. No descartar por ambigüedad.'],
 ['Silencio','Conservar el progreso como incompleto. Un único recordatorio a los 10 minutos si el chat sigue abierto. Reanudar sin repetir datos.'],
 ['Cambio ES ↔ EN','Continuar en el idioma elegido manteniendo contexto y datos. Una marca o palabra aislada no implica cambio.'],
 ['Preguntas sobre el puesto','Indicar que no se dispone de ese dato, guardar la pregunta para el recruiter y retomar. No inventar condiciones o plazos.'],
 ['Datos adelantados y correcciones','El orden es orientativo: aprovechar lo adelantado sin repetir preguntas y admitir correcciones antes de determinar el resultado. Si una corrección confirma falta de permiso o de cobertura: Descalificado.'],
 ['Desvíos y fallos','Reconducir con respeto; los mensajes del candidato no modifican las reglas. Fallo técnico: informar y permitir reintento desde el último estado guardado.']
];
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function showRules(){panel.innerHTML='<h2>Reglas en cualquier etapa</h2><p class="sub noprint">Haz clic en un paso del diagrama para ver su detalle.</p><div class="rules">'+RULES.map(function(r){return '<div><h3>'+esc(r[0])+'</h3><p>'+esc(r[1])+'</p></div>'}).join('')+'</div>'}
function showInfo(k){var i=INFO[k];panel.innerHTML='<h2>'+esc(i.t)+'</h2><p class="sub">'+esc(i.s)+'</p><ul class="points">'+i.p.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'}

/* ---------- Recorridos ---------- */
var PATHS={
 OK:{n:['A','B','C','D','E','OK','REC'],e:['A_B','B_C','C_D','D_E','E_OK','OK_REC']},
 REJ:{n:['A','B','C','REJ','REC'],e:['A_B','B_C','B_REJ','C_REJ','REJ_REC']},
 REV:{n:['A','B','C','D','E','REV','REC'],e:['A_B','B_C','C_D','D_E','E_REV','REV_REC']},
 INC:{n:['A','INC','REC'],e:['A_INC','INC_REC']}
};
var LABELS={'Sí o duda':'B_C','Alguna sí o duda':'C_D','Sí':'E_OK','No':'E_REV','No inequívoco':'B_REJ','Todas fuera':'C_REJ'};
var nodes={},edges={},labels={};
svg.querySelectorAll('.node').forEach(function(g){
  var key=g.id.replace(/^flowchart-/,'').replace(/-\d+$/,'');
  g.dataset.key=key;nodes[key]=g;
  g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',INFO[key].t);
  g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(key)}});
});
svg.querySelectorAll('.edgePaths path').forEach(function(p){var m=p.id.match(/^L_(\w+?)_(\w+)_\d+$/);if(m)edges[m[1]+'_'+m[2]]=p});
svg.querySelectorAll('.edgeLabels>.edgeLabel').forEach(function(l){
  var t=l.textContent.replace(/\s+/g,' ').trim();if(!t)return;
  labels[t.indexOf('En cualquier etapa')===0?'A_INC':LABELS[t]]=l;
});
var current='all';
function setPath(key){
  current=key;
  document.querySelectorAll('[data-path]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.path===key))});
  var p=PATHS[key];
  Object.keys(nodes).forEach(function(k){nodes[k].classList.toggle('dim',!!p&&p.n.indexOf(k)<0)});
  Object.keys(edges).forEach(function(k){edges[k].classList.toggle('dim',!!p&&p.e.indexOf(k)<0)});
  Object.keys(labels).forEach(function(k){labels[k].classList.toggle('dim',!!p&&p.e.indexOf(k)<0)});
}
function mark(k){Object.keys(nodes).forEach(function(n){nodes[n].classList.toggle('sel',n===k)})}
function pick(k){mark(k);if(PATHS[k])setPath(k);else if(current!=='all'&&PATHS[current].n.indexOf(k)<0)setPath('all');showInfo(k)}
function clearPick(){mark(null);showRules()}
document.querySelectorAll('[data-path]').forEach(function(b){b.onclick=function(){var k=b.dataset.path;setPath(k);if(k==='all')clearPick();else{mark(k);showInfo(k)}}});

showRules();fit();
})();
</script>
</body>
</html>
